# GhostControl takes donations two ways.
#
# GitHub Sponsors (native button below) — supports the maintainer directly
# through GitHub.
#
# Crypto — see the README's Support section for the addresses (Bitcoin,
# Ethereum/EVM, Solana, Tron, Monero). Monero keeps both the maintainer and
# the donor anonymous; the others are pseudonymous on-chain and not tied to
# any public identity.
github: [bittricks]
custom: ["https://github.com/bittricks/ghostcontrol#support"]
